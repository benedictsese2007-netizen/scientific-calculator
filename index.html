<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101522"><meta name="description" content="A simple Bens Scientific Calc."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Bens Scientific Calc</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef1fa;background:#101522;--accent:#a9e36b;--key:#252c3c}*{box-sizing:border-box}body{min-height:100vh;min-height:100svh;margin:0;padding:20px;display:grid;place-items:center;background:radial-gradient(ellipse at 18% 12%,#4d699138,transparent 36%),#101522}main{width:min(100%,440px);padding:24px;border:1px solid #2a3244;border-radius:26px;background:#191f2e;box-shadow:0 28px 80px #0006}h1{margin:0;font-size:1.2rem}.intro{margin:7px 0 19px;color:#929bb0;font-size:.88rem}.mode{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:#929bb0;font-size:.8rem}button{border:0;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}button:focus-visible{outline:3px solid #849b68;outline-offset:3px}#angle{min-width:60px;padding:8px 11px;border:1px solid #353d50;background:#202738;color:#c2cadd;font-size:.75rem;font-weight:750;letter-spacing:.06em}.display{display:flex;min-height:122px;flex-direction:column;justify-content:flex-end;overflow:hidden;margin-bottom:17px;padding:17px 15px;border:1px solid #30384a;border-radius:16px;background:#141a27;text-align:right}#expression{min-height:1.5em;margin:0 0 7px;overflow-wrap:anywhere;color:#929bb0;font-size:.95rem}#result{min-height:1.2em;overflow:hidden;color:#f5f7fc;font-size:clamp(2rem,9vw,2.8rem);font-weight:500;letter-spacing:-.05em;text-overflow:ellipsis;white-space:nowrap}#result.error{color:#ff8e8e;font-size:1.15rem;letter-spacing:0}.keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.keys button{min-width:0;min-height:52px;padding:4px 2px;background:var(--key);color:#eef1fa;font-size:1rem}.keys button:hover{background:#30394c}.keys .fn{min-height:43px;background:#202738;color:#bdc5d6;font-size:.84rem;font-weight:550}.keys .op{color:var(--accent);font-size:1.18rem}.keys .clear{color:#f09595;font-size:.84rem}.keys .equals{grid-column:span 2;background:var(--accent);color:#192016;font-size:1.3rem}.keys .zero{grid-column:span 2}.hint{margin:16px 0 0;color:#778197;font-size:.75rem;text-align:center}@media(max-width:390px){main{padding:18px}.keys{gap:7px}.keys button{min-height:47px}}</style></head><body><main><h1>Bens Scientific Calc</h1><p class="intro">Everyday math, plus a little more.</p><div class="mode"><span>Trigonometry angle mode</span><button id="angle" aria-label="Switch to radians">DEG</button></div><div class="display"><p id="expression"></p><output id="result" aria-live="polite">0</output></div><div class="keys"><button class="fn" data-v="sin(">sin</button><button class="fn" data-v="cos(">cos</button><button class="fn" data-v="tan(">tan</button><button class="fn" data-v="log(">log</button><button class="fn" data-v="ln(">ln</button><button class="fn" data-v="sqrt(">√</button><button class="fn" data-v="^2">x²</button><button class="fn" data-v="^">xʸ</button><button class="fn" data-v="pi">π</button><button class="fn" data-v="e">e</button><button class="fn" data-v="(">(</button><button class="fn" data-v=")">)</button><button class="fn" data-v="!">n!</button><button class="fn" data-v="%">%</button><button class="clear" data-action="clear">AC</button><button data-v="7">7</button><button data-v="8">8</button><button data-v="9">9</button><button class="op" data-v="/">÷</button><button class="clear" data-action="delete">DEL</button><button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button><button class="op" data-v="*">×</button><button class="op" data-v="-">−</button><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button class="op" data-action="sign">±</button><button class="op" data-v="+">+</button><button class="zero" data-v="0">0</button><button data-v=".">.</button><button class="equals" data-action="equals">=</button></div><p class="hint">Enter to calculate · Esc to clear · Backspace to delete</p></main><script>
const expr=document.querySelector('#expression'),result=document.querySelector('#result'),keys=document.querySelector('.keys'),angleButton=document.querySelector('#angle');let text='',angle='DEG',answer=0,done=false;function evaluate(input){if(!input)throw Error('Enter an expression');const tokens=input.match(/(?:\d+\.?\d*(?:e[+\-]?\d+)?|\.\d+(?:e[+\-]?\d+)?|[a-z]+|[()+\-*/^%!])/gi)||[];if(tokens.join('').toLowerCase()!==input.replace(/\s/g,'').toLowerCase())throw Error('Check the expression');let i=0,peek=()=>tokens[i],take=x=>peek()===x?(i++,true):false;const functionNames=new Set(['sin','cos','tan','log','ln','sqrt']);function primary(){const t=peek();if(!t)throw Error('Complete the expression');if(/^\d|^\./.test(t)){i++;return Number(t)}if(/^[a-z]+$/i.test(t)){i++;const name=t.toLowerCase();if(name==='pi')return Math.PI;if(name==='e')return Math.E;if(!functionNames.has(name))throw Error('Unknown function');if(!take('('))throw Error('Add an opening parenthesis');const v=expression();if(!take(')'))throw Error('Add a closing parenthesis');if(name==='sqrt'){if(v<0)throw Error('Square root needs a non-negative number');return Math.sqrt(v)}if(name==='log'||name==='ln'){if(v<=0)throw Error('Logarithm needs a positive number');return name==='log'?Math.log10(v):Math.log(v)}const radians=angle==='DEG'?v*Math.PI/180:v;if(name==='tan'&&Math.abs(Math.cos(radians))<1e-12)throw Error('Tangent is undefined here');const value=Math[name](radians);return Math.abs(value)<1e-12?0:value}if(take('(')){const v=expression();if(!take(')'))throw Error('Add a closing parenthesis');return v}throw Error('Check the expression')}function postfix(){let v=primary();while(take('!')||take('%')){const op=tokens[i-1];if(op==='!'){if(!Number.isInteger(v)||v<0||v>170)throw Error('Factorial needs an integer from 0 to 170');for(let n=2;n<=v;n++)v*=n}else v/=100}return v}function power(){const v=postfix();return take('^')?v**unary():v}function unary(){return take('+')?unary():take('-')?-unary():power()}function startsFactor(t){return !!t&&(t==='('||/^\d|^\./.test(t)||/^[a-z]+$/i.test(t))}function term(){let v=unary();while(true){if(take('*'))v*=unary();else if(take('/')){const d=unary();if(!d)throw Error('Cannot divide by zero');v/=d}else if(startsFactor(peek()))v*=unary();else return v}}function expression(){let v=term();while(peek()==='+'||peek()==='-'){const op=tokens[i++],r=term();v=op==='+'?v+r:v-r}return v}const v=expression();if(i<tokens.length)throw Error('Check the expression');if(!Number.isFinite(v))throw Error('Result is outside the supported range');return v}function render(showError=false){expr.textContent=text.replaceAll('*','×').replaceAll('/','÷').replaceAll('pi','π');result.classList.remove('error');if(!text){result.textContent='0';return}try{answer=evaluate(text);result.textContent=new Intl.NumberFormat(undefined,{maximumSignificantDigits:12}).format(Object.is(answer,-0)?0:answer)}catch(error){result.textContent=showError?error.message:'';if(showError)result.classList.add('error')}}function insert(value){if(done){if(/^[+\-*/^]$/.test(value)||value==='!'||value==='%')text=String(answer)+value;else if(value==='^2')text=String(answer)+'^2';else text=value==='.'?'0.':value}else{if(value==='.'&&/\d*\.\d*$/.test(text))return;text+=value}done=false;render()}function clear(){text='';done=false;render()}function calculate(){if(!text)return;render(true);if(!result.classList.contains('error')){text=String(answer);done=true}}keys.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.action==='clear')clear();else if(b.dataset.action==='delete'){if(done)clear();else{text=text.replace(/(?:sqrt|sin|cos|tan|log|ln)\($/,'');if(text.endsWith('(')&&/[a-z]+$/.test(text))text=text.slice(0,-1);else text=text.slice(0,-1);render()}}else if(b.dataset.action==='equals')calculate();else if(b.dataset.action==='sign'){text=done?String(-answer):text?'-('+text+')':text;done=false;render()}else insert(b.dataset.v)});angleButton.addEventListener('click',()=>{angle=angle==='DEG'?'RAD':'DEG';angleButton.textContent=angle;angleButton.setAttribute('aria-label','Switch to '+(angle==='DEG'?'radians':'degrees'));render()});document.addEventListener('keydown',event=>{if(/^[0-9]$/.test(event.key)||'.+-*/^()%!'.includes(event.key)){event.preventDefault();insert(event.key)}else if(event.key==='Enter'||event.key==='='){event.preventDefault();calculate()}else if(event.key==='Backspace'){event.preventDefault();text=text.slice(0,-1);done=false;render()}else if(event.key==='Escape')clear()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(error=>console.error('Offline support could not be registered.',error));
</script></body></html>
